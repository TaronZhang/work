{% extends "base.html" %}
{% block title %}主控台 - 标书信息提取系统{% endblock %}

{% block head %}
<style>
/* ── Dashboard Layout ─────────────────────────── */
.dash-layout {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: var(--space-lg);
    min-height: calc(100vh - 120px);
}

/* ── Stats Bar ────────────────────────────────── */
.stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
}
.stat-item {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
}
.stat-item:hover { border-color: var(--accent-blue); }
.stat-item.active-filter { border-color: var(--accent-blue); background: rgba(74,158,255,0.06); }
.stat-value { font-size: 28px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value.active { color: var(--accent-blue); }
.stat-value.ended { color: var(--text-tertiary); }
.stat-value.urgent { color: var(--amber); }
.stat-value.total { color: var(--text-primary); }

/* ── Calendar ─────────────────────────────────── */
.calendar-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
}
.cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--border);
}
.cal-title { font-size: 15px; font-weight: 600; }
.cal-nav { display: flex; gap: var(--space-xs); }
.cal-nav button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
}
.cal-nav button:hover { background: var(--bg-surface-hover); }
.cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    padding: var(--space-sm) 0;
    font-size: 12px;
    color: var(--text-tertiary);
    border-bottom: 1px solid var(--border);
}
.cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(64px, auto);
}
.cal-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4px 6px;
    cursor: pointer;
    transition: background var(--duration-fast);
    min-height: 64px;
    overflow: hidden;
    position: relative;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:hover { background: var(--bg-surface-hover); }
.cal-cell.other-month { opacity: 0.3; }
.cal-cell.today { background: rgba(74,158,255,0.08); }
.cal-cell.selected { background: rgba(74,158,255,0.15); outline: 1px solid var(--accent-blue); outline-offset: -1px; }
.cal-date {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
}
.cal-cell.today .cal-date { color: var(--accent-blue); font-weight: 700; }
.cal-event {
    font-size: 10px;
    line-height: 1.3;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 1px 3px;
    margin-bottom: 1px;
    border-radius: 2px;
    background: rgba(74,158,255,0.1);
    border-left: 2px solid var(--accent-blue);
}
.cal-event.urgent { border-left-color: var(--amber); background: rgba(240,192,64,0.1); }
.cal-event.ended { border-left-color: var(--text-tertiary); background: rgba(154,154,163,0.08); }
.cal-event-more {
    font-size: 10px;
    color: var(--accent-blue);
    cursor: pointer;
}

/* ── Right Panel ──────────────────────────────── */
.right-panel {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
}
.project-list-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    flex: 1;
}
.pl-header {
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.pl-list { overflow-y: auto; max-height: calc(100vh - 400px); }
.pl-item {
    padding: var(--space-sm) var(--space-lg);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background var(--duration-fast);
}
.pl-item:hover { background: var(--bg-surface-hover); }
.pl-item.selected { background: rgba(74,158,255,0.06); border-left: 3px solid var(--accent-blue); }
.pl-item-name { font-size: 14px; font-weight: 500; }
.pl-item-client { font-size: 12px; color: var(--text-secondary); }
.pl-item-dates { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.pl-item-dates span { margin-right: var(--space-sm); }

.upload-mini {
    background: var(--bg-surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    text-align: center;
    cursor: pointer;
    transition: all var(--duration-fast);
}
.upload-mini:hover { border-color: var(--accent-blue); background: rgba(74,158,255,0.04); }
.upload-mini-text { font-size: 13px; color: var(--text-secondary); }

/* ── Detail Panel (slide-out) ──────────────────── */
.detail-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 200;
    display: none;
}
.detail-overlay.open { display: block; }
.detail-panel {
    position: fixed; top: 0; right: -480px; width: 460px; height: 100%;
    background: var(--bg-default); z-index: 201;
    transition: right 0.3s var(--ease-out);
    box-shadow: -4px 0 24px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    overflow-y: auto;
}
.detail-panel.open { right: 0; }
.detail-header {
    padding: var(--space-lg);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--bg-default); z-index: 1;
}
.detail-body { padding: var(--space-lg); flex: 1; }
.detail-actions {
    padding: var(--space-md) var(--space-lg);
    border-top: 1px solid var(--border);
    display: flex; gap: var(--space-sm); flex-wrap: wrap;
    position: sticky; bottom: 0; background: var(--bg-default);
}

/* ── Responsive ────────────────────────────────── */
@media (max-width: 1024px) {
    .dash-layout { grid-template-columns: 1fr; }
    .right-panel { flex-direction: row; flex-wrap: wrap; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .cal-cell { min-height: 48px; }
    .detail-panel { width: 100%; right: -100%; }
}
</style>
{% endblock %}

{% block content %}
<!-- Stats Bar -->
<div class="stats-bar">
    <div class="stat-item active-filter" data-filter="active" onclick="filterByStatus('active', this)">
        <div class="stat-value active" id="stat-active">--</div>
        <div class="stat-label">进行中</div>
    </div>
    <div class="stat-item" data-filter="ended" onclick="filterByStatus('ended', this)">
        <div class="stat-value ended" id="stat-ended">--</div>
        <div class="stat-label">已结束</div>
    </div>
    <div class="stat-item" data-filter="urgent" onclick="filterByStatus('urgent', this)">
        <div class="stat-value urgent" id="stat-urgent">--</div>
        <div class="stat-label">即将截止 (7天内)</div>
    </div>
    <div class="stat-item" data-filter="all" onclick="filterByStatus('all', this)">
        <div class="stat-value total" id="stat-total">--</div>
        <div class="stat-label">总项目数</div>
    </div>
</div>

<!-- Main Layout -->
<div class="dash-layout">
    <!-- Calendar -->
    <div class="calendar-panel">
        <div class="cal-header">
            <span class="cal-title" id="cal-title">--</span>
            <div class="cal-nav">
                <button onclick="navigateMonth(-1)">←</button>
                <button onclick="navigateMonth(0)">●</button>
                <button onclick="navigateMonth(1)">→</button>
            </div>
        </div>
        <div class="cal-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="upload-mini" id="upload-mini">
            <input type="file" id="file-input" accept=".pdf,.docx" hidden>
            <div class="upload-mini-text">📁 点击或拖拽上传标书</div>
        </div>
        <div class="project-list-panel">
            <div class="pl-header">
                <span style="font-weight:600;font-size:15px;">项目列表</span>
                <span style="font-size:12px;color:var(--text-tertiary);" id="pl-count"></span>
            </div>
            <div class="pl-list" id="project-list"></div>
        </div>
    </div>
</div>

<!-- Detail Panel (slide-out) -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
    <div class="detail-header">
        <h3 style="font-size:16px;" id="detail-title">项目详情</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-actions" id="detail-actions"></div>
</div>

<!-- Hidden progress -->
<div id="upload-progress" class="upload-progress hidden">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text"></span>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
