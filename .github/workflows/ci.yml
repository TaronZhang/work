name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Lint with ruff
        run: ruff check src/ app.py tests/
      - name: Check formatting
        run: ruff format --check src/ app.py tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Security audit
        run: pip-audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker build
        run: |
          docker build -t docdiff:latest .
          docker run --rm docdiff:latest python -c "from src.config import config; print('Config OK')"
